name: android-preview

# Records a walkthrough of the Android client (PR #3, feat/android-client) on a LINUX runner
# and posts it inline to the PR. Android emulators run on ubuntu — no macOS cost. This workflow
# touches only .github/workflows/** and previews/**, never Swift paths, so it can NEVER trigger
# build-apple.yml (macOS) or visual-verify.yml.

on:
  push:
    branches: [claude/android-preview]
    paths-ignore: ['previews/**']
  workflow_dispatch:

permissions:
  contents: write        # host the GIF on this branch
  pull-requests: write   # post the inline comment on PR #3

concurrency:
  group: android-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Record walkthrough on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_5
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -x
            APP=com.remapp.rem.debug
            adb wait-for-device
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            for P in android.permission.READ_CALENDAR android.permission.RECORD_AUDIO android.permission.POST_NOTIFICATIONS; do
              adb shell pm grant "$APP" "$P" || true
            done
            adb shell am start -n "$APP/com.remapp.rem.MainActivity"
            sleep 6
            ( adb shell screenrecord --time-limit 24 --bit-rate 6000000 /sdcard/preview.mp4 ) &
            REC=$!
            sleep 3;  adb shell input tap 540 1900
            sleep 3;  adb shell input swipe 540 1400 540 700 300
            sleep 3;  adb shell input tap 540 1900
            sleep 3;  adb shell input keyevent 4
            wait "$REC" || true
            adb pull /sdcard/preview.mp4 preview.mp4 || true

      - name: Convert to GIF
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          ffmpeg -y -i preview.mp4 -vf "fps=12,scale=380:-1:flags=lanczos" -loop 0 preview.gif
          ls -la preview.mp4 preview.gif

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-preview
          path: |
            preview.mp4
            preview.gif
          if-no-files-found: warn

      - name: Publish GIF + comment on PR #3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f preview.gif ] || { echo "no gif produced"; exit 0; }
          mkdir -p previews && cp preview.gif previews/android.gif
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add previews/android.gif
          git commit -m "chore(preview): android walkthrough [skip ci]" || { echo "no gif change"; exit 0; }
          git push origin HEAD:claude/android-preview
          SHA="$(git rev-parse HEAD)"
          RAW="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/raw/$SHA/previews/android.gif"
          RUN="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            printf '### Android client — CI walkthrough (emulator, API 30, Linux runner)\n\n'
            printf 'Built from `feat/android-client` with `./gradlew :app:assembleDebug` (no backend configured, so this shows **launch to first-run / sign-in**).\n\n'
            printf '![Android walkthrough](%s)\n\n' "$RAW"
            printf 'Full video + GIF are also attached as artifacts on [this run](%s).\n\n' "$RUN"
            printf -- '---\n'
            printf '_Generated by [Claude Code](https://claude.ai/code)_\n'
          } > body.md
          gh pr comment 3 --repo "$GITHUB_REPOSITORY" --body-file body.md

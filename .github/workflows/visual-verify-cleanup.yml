name: Visual Verify — cleanup

# Keep the store bounded WITHOUT losing merged-PR history: when a PR is closed
# WITHOUT merging (abandoned work), remove its folder from the visual-verify-shots
# branch. MERGED PRs KEEP their screenshots as a durable visual record. Runs on
# free Linux. Because images are referenced by BRANCH url (not commit SHA), a
# `git checkout --orphan` squash of this branch can later reclaim .git churn
# history without breaking any live image — run that manually if the kept set of
# merged-PR screenshots ever makes clones heavy.

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup:
    # Only abandoned PRs (closed without merging). Merged PRs keep their record.
    if: ${{ github.event.pull_request.merged == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Remove an abandoned PR's screenshots from the shots branch
        env:
          GH_TOKEN: ${{ github.token }}
          PRNUM: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          B="visual-verify-shots"
          AUTH="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git ls-remote --exit-code --heads "$AUTH" "$B" >/dev/null 2>&1 || { echo "no shots branch yet"; exit 0; }
          TMP="$(mktemp -d)"
          git clone --quiet --depth 1 --branch "$B" "$AUTH" "$TMP"
          cd "$TMP"
          if [ -d "pr-${PRNUM}" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm -rq "pr-${PRNUM}"
            git commit --quiet -m "visual-verify: remove screenshots for closed PR #${PRNUM}"
            git push --quiet origin "HEAD:${B}"
            echo "removed pr-${PRNUM}"
          else
            echo "nothing to remove for PR #${PRNUM}"
          fi
